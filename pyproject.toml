[project]
name = "content-agent"
version = "0.1.0"
description = "LangGraph content marketing agent: router, deep research, content strategist"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph",
    "langchain-openai",
    "langchain-core",
    "google-search-results",
    "python-dotenv",
    "pydantic",
]

[dependency-groups]
dev = [
    "pytest",
    "langgraph-cli[inmem]",
    "grandalf>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["content_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
